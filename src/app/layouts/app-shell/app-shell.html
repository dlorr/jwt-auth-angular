<div class="min-h-screen bg-slate-50">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4">
      <a routerLink="/dashboard" class="text-lg font-bold tracking-tight text-slate-950">
        JWT Auth
      </a>

      <nav class="flex items-center gap-4 text-sm">
        <a
          routerLink="/dashboard"
          routerLinkActive="text-slate-950"
          class="font-medium text-slate-500 hover:text-slate-950"
        >
          Dashboard
        </a>

        <a
          routerLink="/sessions"
          routerLinkActive="text-slate-950"
          class="font-medium text-slate-500 hover:text-slate-950"
        >
          Sessions
        </a>

        <button
          type="button"
          (click)="logout()"
          class="rounded-lg bg-slate-950 px-3 py-2 text-sm font-medium text-white hover:bg-slate-800"
        >
          Logout
        </button>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-8">
    <router-outlet />
  </main>
</div>
