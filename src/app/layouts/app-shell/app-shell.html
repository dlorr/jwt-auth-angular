<div class="min-h-screen bg-background text-foreground">
  <header class="sticky top-0 z-50 border-b border-border bg-card/90 backdrop-blur">
    <div class="container flex h-16 items-center justify-between">
      <div class="flex items-center gap-10">
        <a routerLink="/dashboard" class="font-display text-xl font-bold text-foreground">
          JWT Auth
        </a>

        <nav class="flex gap-6">
          <a routerLink="/dashboard" routerLinkActive="text-primary" class="nav-link">
            Dashboard
          </a>

          <a routerLink="/sessions" routerLinkActive="text-primary" class="nav-link"> Sessions </a>
        </nav>
      </div>

      <div class="flex items-center gap-5">
        @if (user()) {
          <div class="hidden text-right sm:block">
            <p class="text-sm font-semibold text-foreground">
              {{ user()?.email }}
            </p>

            <p class="text-xs text-muted-foreground">
              {{ user()?.verified ? 'Verified Account' : 'Unverified' }}
            </p>
          </div>
        }

        <button type="button" (click)="logout()" class="btn-ghost w-auto px-5">Logout</button>
      </div>
    </div>
  </header>

  <main class="container py-10">
    <router-outlet />
  </main>
</div>
