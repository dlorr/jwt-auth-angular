<div class="min-h-screen bg-slate-100 p-6">
  <div class="mx-auto max-w-4xl rounded-xl bg-white p-6 shadow-sm">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold">Dashboard</h1>

        @if (user()) {
          <p class="mt-2 text-sm text-gray-600">Logged in as {{ user()?.email }}</p>

          <p class="text-sm text-gray-600">Verified: {{ user()?.verified ? 'Yes' : 'No' }}</p>
        }
      </div>

      <button
        type="button"
        (click)="logout()"
        [disabled]="loading()"
        class="rounded-lg bg-black px-4 py-2 text-white disabled:opacity-50"
      >
        {{ loading() ? 'Logging out...' : 'Logout' }}
      </button>
    </div>
  </div>
</div>
