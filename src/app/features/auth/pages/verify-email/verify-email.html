<div class="min-h-screen flex items-center justify-center bg-slate-100 p-4">
  <app-card class="w-full max-w-md text-center">
    <h1 class="text-2xl font-bold mb-4">Email Verification</h1>

    @if (loading()) {
      <div class="flex justify-center">
        <app-spinner />
      </div>
    }

    @if (successMessage()) {
      <p class="text-sm text-green-600">
        {{ successMessage() }}
      </p>

      <a routerLink="/login" class="mt-4 inline-block text-blue-600 hover:underline">
        Go to Login
      </a>
    }

    @if (serverError()) {
      <app-error-message [message]="serverError()" />

      <a routerLink="/login" class="mt-4 inline-block text-blue-600 hover:underline">
        Back to Login
      </a>
    }
  </app-card>
</div>
