<div class="flex min-h-screen items-center justify-center bg-slate-50 px-4 py-10">
  <app-card class="w-full max-w-md">
    <div class="mb-6 text-center">
      <h1 class="text-2xl font-bold tracking-tight text-slate-950">Login</h1>
      <p class="mt-2 text-sm text-slate-600">Welcome back. Enter your details below.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="mb-1.5 block text-sm font-medium text-slate-700">Email</label>

        <input
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="you@example.com"
          class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm outline-none transition placeholder:text-slate-400 focus:border-slate-500 focus:ring-2 focus:ring-slate-200"
        />

        @if ((form.controls.email.touched || submitted) && form.controls.email.errors) {
          <app-error-message [message]="getErrorMessage(form.controls.email)" />
        }
      </div>

      <div>
        <label class="mb-1.5 block text-sm font-medium text-slate-700">Password</label>

        <input
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="Enter your password"
          class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm outline-none transition placeholder:text-slate-400 focus:border-slate-500 focus:ring-2 focus:ring-slate-200"
        />

        @if ((form.controls.password.touched || submitted) && form.controls.password.errors) {
          <app-error-message [message]="'Password is required.'" />
        }
      </div>

      <div class="text-right text-sm">
        <a routerLink="/forgot-password" class="font-medium text-slate-700 hover:text-slate-950">
          Forgot password?
        </a>
      </div>

      @if (serverError()) {
        <app-error-message [message]="serverError()" />
      }

      <app-button type="submit" [loading]="loading()">Login</app-button>

      <p class="text-center text-sm text-slate-600">
        Don’t have an account?
        <a routerLink="/register" class="font-medium text-slate-950 hover:underline"> Register </a>
      </p>
    </form>
  </app-card>
</div>
