<div class="min-h-screen flex items-center justify-center bg-slate-100 p-4">
  <app-card class="w-full max-w-md">
    <h1 class="text-2xl font-bold mb-2">Forgot Password</h1>

    <p class="mb-6 text-sm text-gray-600">
      Enter your email and we’ll send you a password reset link.
    </p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block mb-1 text-sm font-medium">Email</label>

        <input type="email" formControlName="email" class="w-full rounded border px-3 py-2" />

        @if ((form.controls.email.touched || submitted) && form.controls.email.errors) {
          <app-error-message [message]="getErrorMessage(form.controls.email)" />
        }
      </div>

      @if (serverError()) {
        <app-error-message [message]="serverError()" />
      }

      @if (successMessage()) {
        <p class="text-sm text-green-600">
          {{ successMessage() }}
        </p>
      }

      <app-button type="submit" [loading]="loading()"> Send Reset Link </app-button>

      <div class="text-center text-sm">
        Remember your password?
        <a routerLink="/login" class="text-blue-600 hover:underline">Login</a>
      </div>
    </form>
  </app-card>
</div>
