<div
  class="relative flex min-h-screen items-center justify-center overflow-hidden bg-background px-4 py-10"
>
  <div class="auth-glow left-20 top-24 bg-primary"></div>
  <div class="auth-glow bottom-20 right-20 bg-secondary"></div>

  <app-card class="page-enter">
    <div class="mb-8 text-center">
      <h1 class="text-3xl font-bold text-foreground">Forgot Password</h1>

      <p class="mt-2 text-sm text-muted-foreground">
        Enter your email and we'll send you a reset link.
      </p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">
      <div class="form-group">
        <label class="field-label">Email</label>

        <input
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="you@example.com"
          class="field-input"
        />

        @if ((form.controls.email.touched || submitted) && form.controls.email.errors) {
          <app-error-message [message]="getErrorMessage(form.controls.email)" />
        }
      </div>

      @if (serverError()) {
        <div class="alert-error">
          {{ serverError() }}
        </div>
      }

      @if (successMessage()) {
        <div class="alert-success">
          {{ successMessage() }}
        </div>
      }

      <app-button type="submit" [loading]="loading()"> Send Reset Link </app-button>

      <p class="text-center text-sm text-muted-foreground">
        Remember your password?

        <a routerLink="/login" class="font-medium text-primary hover:underline"> Login </a>
      </p>
    </form>
  </app-card>
</div>
