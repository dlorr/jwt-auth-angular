<button
  [type]="type()"
  [disabled]="disabled() || loading()"
  class="flex w-full items-center justify-center rounded-lg bg-black px-4 py-2 text-white transition hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-50"
>
  @if (loading()) {
    <app-spinner />
  } @else {
    <ng-content />
  }
</button>
